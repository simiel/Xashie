substitutions:
  _REGION: africa-south1
  _PROJECT_ID: my-hashie-app
  _SERVICE: hashie-api-v2
  _MIGRATION_JOB: hashie-api-v2-migrate
  _DB_INSTANCE: hashie-postgres-v2
  _IMAGE_REPOSITORY: hashie

steps:
  - id: test
    name: node:22-bookworm
    entrypoint: bash
    dir: hashie-api
    args:
      - -ceu
      - |
        corepack enable
        pnpm install --frozen-lockfile
        pnpm typecheck
        pnpm lint
        pnpm test
        pnpm build

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_IMAGE_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
      - hashie-api

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_IMAGE_REPOSITORY}/${_SERVICE}:$COMMIT_SHA

  - id: deploy-service
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --project=${_PROJECT_ID}
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_IMAGE_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
      - --port=8080
      - --set-env-vars=NODE_ENV=production,HOST=0.0.0.0,PORT=8080,LOG_LEVEL=info,HASHIE_GATEWAY_ENABLED=true,HASHIE_GATEWAY_URL=https://hashie-llm-openai-gateway-5bq6okiwgq-ew.a.run.app/v1,HASHIE_GATEWAY_TIMEOUT_MS=15000,HASHIE_GATEWAY_MAX_RETRIES=2,HASHIE_AKAN_TIMEOUT_MS=30000,CORS_ORIGINS=https://hashie-web-239035662159.africa-south1.run.app
      - --set-secrets=DATABASE_URL=hashie-v2-database-url:latest,CLERK_SECRET_KEY=hashie-v2-clerk-secret-key:latest,CLERK_WEBHOOK_SIGNING_SECRET=hashie-v2-clerk-webhook-signing-secret:latest,HASHIE_GATEWAY_TOKEN=hashie-v2-gateway-token:latest
      - --add-cloudsql-instances=${_PROJECT_ID}:${_REGION}:${_DB_INSTANCE}
      - --min=1
      - --max=10
      - --cpu=1
      - --memory=512Mi
      - --allow-unauthenticated

  - id: deploy-migration-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ${_MIGRATION_JOB}
      - --project=${_PROJECT_ID}
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_IMAGE_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
      - --command=node
      - --args=dist/src/db/migrate.js
      - --set-env-vars=NODE_ENV=production,MIGRATIONS_FOLDER=./drizzle
      - --set-secrets=DATABASE_URL=hashie-v2-database-url:latest
      - --set-cloudsql-instances=${_PROJECT_ID}:${_REGION}:${_DB_INSTANCE}
      - --max-retries=1
      - --task-timeout=10m

  - id: run-migrations
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - execute
      - ${_MIGRATION_JOB}
      - --project=${_PROJECT_ID}
      - --region=${_REGION}
      - --wait

images:
  - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_IMAGE_REPOSITORY}/${_SERVICE}:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
