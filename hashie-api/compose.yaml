services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hashie
      POSTGRES_USER: hashie
      POSTGRES_PASSWORD: hashie
    ports:
      - "5433:5432"
    volumes:
      - hashie-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hashie -d hashie"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hashie-postgres-data:
